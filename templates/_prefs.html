{# Language + colour-mode controls, shared by the top nav and the signed-out pages. #}
<form method="post" action="{{ url_for('set_language') }}" class="pv-lang">
    <input type="hidden" name="next" value="{{ request.full_path if request.query_string else request.path }}">
    <select name="lang" aria-label="{{ t('language') }}" title="{{ t('language') }}" onchange="this.form.submit()">
        <option value="tr" {% if current_lang == 'tr' %}selected{% endif %}>TR</option>
        <option value="en" {% if current_lang == 'en' %}selected{% endif %}>EN</option>
    </select>
</form>
{% include '_mode_switch.html' %}
