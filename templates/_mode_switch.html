{# Colour mode switch: light / dark / system. State is applied and stored by the script in base.html. #}
<div class="pv-mode-switch" role="radiogroup" aria-label="{{ lang_text('Tema', 'Theme') }}">
    <button type="button" role="radio" aria-checked="false" data-mode-value="light"
            title="{{ lang_text('Açık tema', 'Light theme') }}" aria-label="{{ lang_text('Açık tema', 'Light theme') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"/>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
    </button>
    <button type="button" role="radio" aria-checked="false" data-mode-value="dark"
            title="{{ lang_text('Koyu tema', 'Dark theme') }}" aria-label="{{ lang_text('Koyu tema', 'Dark theme') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5a8.5 8.5 0 1 0 11 11z"/>
        </svg>
    </button>
    <button type="button" role="radio" aria-checked="false" data-mode-value="system"
            title="{{ lang_text('Sistem varsayılanı', 'System default') }}" aria-label="{{ lang_text('Sistem varsayılanı', 'System default') }}">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <rect x="3" y="4" width="18" height="12" rx="1.5"/>
            <path d="M8 20h8M12 16v4"/>
        </svg>
    </button>
</div>
